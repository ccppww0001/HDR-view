[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hdrview"
version = "0.0.0"
description = "可验证的 vivo XDR 与 NVIDIA HDR 研究工具"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "Pillow>=11",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hdrview = "hdrview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hdrview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
